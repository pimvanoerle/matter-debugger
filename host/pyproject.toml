[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matter-debugger"
version = "0.1.0"
description = "Walk-around radio probe and LAN checks for debugging Matter and Thread smart homes"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["click>=8", "pyserial>=3.5", "zeroconf>=0.130"]

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8"]

[project.scripts]
matter-debugger = "matter_debugger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matter_debugger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
